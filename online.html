<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Anyone Docking" />
  <meta name="theme-color" content="#ffffff" />
  <title>Anyone can dock</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/nyelidl/anyone-docking/main/st/any-A.png" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --red: #ff4b4b; --purple: #cc44cc; --blue: #4b8bff; }
    body {
      font-family: "Inter", sans-serif;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 1rem;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 40%, rgba(255,75,75,.07), transparent),
        radial-gradient(ellipse 50% 60% at 80% 60%, rgba(75,139,255,.07), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 520px;
      animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 84px;
      height: 84px;
      margin-bottom: 1.4rem;
      filter: drop-shadow(0 4px 16px rgba(255,75,75,.25));
    }
    h1 {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      background: linear-gradient(90deg, #ff4b4b, #cc44cc, #4b8bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: #888; font-size: 0.92rem; margin-bottom: 1rem; min-height: 1.3em; }
    .mode-badge {
      margin-bottom: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #f4f4f6;
      color: #555;
    }
    .mode-badge.workshop { background: rgba(75,139,255,.12); color: #2962d8; }
    .mode-badge.normal { background: rgba(76,175,80,.12); color: #2f7d33; }
    .spinner {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid #eee;
      border-top-color: var(--red);
      border-right-color: var(--purple);
      animation: spin 0.9s linear infinite;
      margin-bottom: 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-wrap {
      width: 240px;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      margin-bottom: 1.4rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--red), var(--purple), var(--blue));
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .server-grid {
      display: grid;
      grid-template-columns: repeat(8, 10px);
      gap: 8px;
      justify-content: center;
      margin-bottom: 1rem;
      min-height: 46px;
    }
    .server-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ddd;
      transition: background 0.3s, transform 0.2s;
    }
    .server-dot.checking { background: #f0c040; animation: pulse 1s ease-in-out infinite; }
    .server-dot.online { background: #4caf50; transform: scale(1.2); }
    .server-dot.slow { background: #ff9800; }
    .server-dot.offline { background: #f44336; }
    .server-dot.selected { background: var(--blue); transform: scale(1.5); box-shadow: 0 0 0 3px rgba(75,139,255,.25); }
    .server-dot.aws { background: #2962d8; box-shadow: 0 0 0 3px rgba(41,98,216,.2); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status { font-size: 1rem; font-weight: 600; color: #555; min-height: 1.6em; }
    .hint { font-size: 0.82rem; color: #999; letter-spacing: 0.02em; margin-top: 0.4rem; min-height: 1.2em; }
    .countdown { margin-top: 1rem; min-height: 2.4em; }
    .countdown-num {
      display: inline-block;
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, var(--red), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .fallback-btn {
      display: none;
      margin-top: 1.2rem;
      padding: 0.6rem 1.4rem;
      background: linear-gradient(90deg, var(--red), var(--purple));
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://raw.githubusercontent.com/nyelidl/anyone-docking/main/any-L.svg" alt="Anyone Can Dock" />
    <h1>Anyone can dock</h1>
    <p class="subtitle">Loading the best available dock server for your session.</p>
    <div id="modeBadge" class="mode-badge">Loading mode</div>
    <div class="spinner"></div>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="serverGrid" class="server-grid" aria-hidden="true"></div>
    <div id="status" class="status">Checking service availability…</div>
    <div id="hint" class="hint">Please wait while we route you.</div>
    <div id="countdown" class="countdown"></div>
    <button id="fallbackBtn" class="fallback-btn" type="button">Launch fallback server now</button>
  </div>

  <script>
    const CONFIG_URL = "launcher-config.json";
    const TIMEOUT_MS = 8000;
    const FALLBACK_MS = 10000;
    const MIN_DELAY_MS = 0;
    const AWS_HEALTH_TIMEOUT_MS = 5000;
    const REDIRECT_COUNTDOWN_SECONDS = 3;

    let redirected = false;
    let startTime = Date.now();
    let config = null;
    let apps = [];
    let results = [];
    let dots = [];

    const grid = document.getElementById("serverGrid");
    const fallbackBtn = document.getElementById("fallbackBtn");
    fallbackBtn.addEventListener("click", () => redirectToFallback("Manual fallback"));

    function setStatus(msg) { document.getElementById("status").textContent = msg; }
    function setHint(msg) { document.getElementById("hint").textContent = msg; }
    function setProgress(pct) { document.getElementById("progressBar").style.width = pct + "%"; }

    function normalizeConfig(raw) {
      const awsUrl = (raw && typeof raw.aws_url === "string") ? raw.aws_url.trim() : "";
      const awsHealthUrl = (raw && typeof raw.aws_health_url === "string" && raw.aws_health_url.trim())
        ? raw.aws_health_url.trim()
        : (awsUrl ? awsUrl.replace(/\/$/, "") + "/_stcore/health" : "");
      return {
        mode: raw && raw.mode === "workshop" ? "workshop" : "normal",
        aws_url: awsUrl,
        aws_health_url: awsHealthUrl,
        streamlit_fallback: raw && raw.streamlit_fallback !== false,
        streamlit_apps: Array.isArray(raw && raw.streamlit_apps) ? raw.streamlit_apps : []
      };
    }

    async function loadConfig() {
      try {
        const response = await fetch(`${CONFIG_URL}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Config HTTP ${response.status}`);
        }
        return normalizeConfig(await response.json());
      } catch (error) {
        console.warn("Launcher config fetch failed; using baked-in defaults.", error);
        return normalizeConfig({
          mode: "normal",
          streamlit_fallback: true,
          streamlit_apps: [
            "https://anyone-docking-01.streamlit.app/",
            "https://anyone-docking-02.streamlit.app/",
            "https://anyone-docking-03.streamlit.app/",
            "https://anyone-docking-04.streamlit.app/",
            "https://anyone-docking-05.streamlit.app/",
            "https://anyone-docking-06.streamlit.app/",
            "https://anyone-docking-07.streamlit.app/",
            "https://anyone-docking-08.streamlit.app/",
            "https://anyone-docking-09.streamlit.app/",
            "https://anyone-docking-10.streamlit.app/",
            "https://anyone-docking-11.streamlit.app/",
            "https://anyone-docking-12.streamlit.app/",
            "https://anyone-docking-13.streamlit.app/",
            "https://anyone-docking-14.streamlit.app/",
            "https://anyone-docking-15.streamlit.app/",
            "https://anyone-docking-16.streamlit.app/",
            "https://anyone-docking-17.streamlit.app/",
            "https://anyone-docking-18.streamlit.app/",
            "https://anyone-docking-19.streamlit.app/",
            "https://anyone-docking-20.streamlit.app/",
            "https://anyone-docking-21.streamlit.app/",
            "https://anyone-docking-22.streamlit.app/",
            "https://anyone-docking-23.streamlit.app/",
            "https://anyone-docking-24.streamlit.app/"
          ]
        });
      }
    }

    function updateModeBadge(mode) {
      const badge = document.getElementById("modeBadge");
      badge.className = `mode-badge ${mode}`;
      badge.textContent = mode === "workshop" ? "Workshop Mode" : "Normal Mode";
    }

    function renderDots(count) {
      grid.innerHTML = "";
      dots = Array.from({ length: count }, (_, i) => {
        const dot = document.createElement("div");
        dot.className = "server-dot";
        dot.title = `Server ${i + 1}`;
        grid.appendChild(dot);
        return dot;
      });
    }

    function markAwsProbe(active) {
      if (!dots[0]) return;
      dots[0].className = active ? "server-dot checking aws" : "server-dot aws";
      dots[0].title = "AWS workshop endpoint";
    }

    function getNextServer(onlineIndices) {
      const key = "acd_rr_counter";
      let counter = parseInt(localStorage.getItem(key) || "0", 10);
      if (!Number.isFinite(counter)) counter = 0;
      const idx = onlineIndices[counter % onlineIndices.length];
      localStorage.setItem(key, String(counter + 1));
      return idx;
    }

    function doRedirect(url, label) {
      if (redirected) return;
      redirected = true;
      setProgress(100);
      let count = REDIRECT_COUNTDOWN_SECONDS;
      const cdEl = document.getElementById("countdown");
      function tick() {
        if (count > 0) {
          setStatus(`${label} is ready — opening in…`);
          cdEl.innerHTML = `<span class="countdown-num">${count}</span>`;
          count -= 1;
          setTimeout(tick, 1000);
        } else {
          setStatus("Launching…");
          cdEl.textContent = "";
          setHint(label);
          setTimeout(() => { window.location.href = url; }, 300);
        }
      }
      tick();
    }

    function checkProgress() {
      const done = results.filter((r) => r !== null).length;
      const total = Math.max(results.length, 1);
      setProgress(Math.round((done / total) * 90));
    }

    function redirectToFallback(reason) {
      if (redirected) return;
      const online = results.map((r, i) => r && r.ok ? i : -1).filter((i) => i >= 0);
      if (online.length > 0) {
        const idx = getNextServer(online);
        dots[idx].className = "server-dot selected";
        doRedirect(apps[idx], `Streamlit server ${idx + 1}`);
        return;
      }
      if (apps.length > 0) {
        const idx = Math.floor(Math.random() * apps.length);
        doRedirect(apps[idx], `Fallback server ${idx + 1}`);
        return;
      }
      setStatus("No launch target is currently reachable.");
      setHint(reason || "Check workshop and Streamlit deployment status.");
    }

    function tryRedirect() {
      if (redirected) return;
      const done = results.filter((r) => r !== null).length;
      const online = results.map((r, i) => r && r.ok ? i : -1).filter((i) => i >= 0);
      const elapsed = Date.now() - startTime;
      if ((done === results.length || elapsed >= MIN_DELAY_MS) && online.length > 0) {
        const idx = getNextServer(online);
        dots[idx].className = "server-dot selected";
        doRedirect(apps[idx], `Streamlit server ${idx + 1}`);
      }
    }

    async function probeUrl(url, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      const t0 = Date.now();
      try {
        await fetch(`${url}${url.includes("?") ? "&" : "?"}ts=${Date.now()}`, {
          mode: "no-cors",
          signal: controller.signal,
          cache: "no-store"
        });
        clearTimeout(timer);
        return { ok: true, ms: Date.now() - t0 };
      } catch (error) {
        clearTimeout(timer);
        return { ok: false, ms: null, error };
      }
    }

    async function routeWorkshop() {
      setStatus("Workshop mode enabled — checking AWS capacity first…");
      setHint("AWS is preferred when healthy; Streamlit remains the fallback.");
      if (!config.aws_url || !config.aws_health_url) {
        setStatus("Workshop mode is enabled, but no AWS endpoint is configured.");
        setHint("Falling back to Streamlit Community Cloud.");
        startStreamlitRouting();
        return;
      }
      renderDots(1);
      markAwsProbe(true);
      const awsProbe = await probeUrl(config.aws_health_url, AWS_HEALTH_TIMEOUT_MS);
      if (awsProbe.ok) {
        markAwsProbe(false);
        dots[0].className = "server-dot selected aws";
        setProgress(100);
        doRedirect(config.aws_url, "AWS workshop endpoint");
        return;
      }
      dots[0].className = "server-dot offline";
      if (!config.streamlit_fallback) {
        setStatus("AWS workshop endpoint is unavailable.");
        setHint("Workshop mode is enabled, but Streamlit fallback is disabled.");
        return;
      }
      setStatus("AWS is unavailable — falling back to Streamlit Community Cloud…");
      setHint("Normal Streamlit routing is still available.");
      startStreamlitRouting();
    }

    function startStreamlitRouting() {
      apps = config.streamlit_apps.slice();
      results = new Array(apps.length).fill(null);
      renderDots(apps.length);
      startTime = Date.now();
      apps.forEach((url, i) => {
        dots[i].className = "server-dot checking";
        probeUrl(url, TIMEOUT_MS).then((result) => {
          results[i] = result;
          dots[i].className = result.ok ? (result.ms < 2000 ? "server-dot online" : "server-dot slow") : "server-dot offline";
          checkProgress();
          tryRedirect();
        });
      });
      setTimeout(() => {
        if (redirected) return;
        const online = results.map((r, i) => r && r.ok ? i : -1).filter((i) => i >= 0);
        if (online.length > 0) {
          const idx = getNextServer(online);
          dots[idx].className = "server-dot selected";
          doRedirect(apps[idx], `Streamlit server ${idx + 1}`);
          return;
        }
        setStatus("All Streamlit servers are starting up…");
        setHint("Launching the best fallback we can reach.");
        fallbackBtn.style.display = "inline-block";
        redirectToFallback("Timed fallback");
      }, FALLBACK_MS);
    }

    async function boot() {
      config = await loadConfig();
      updateModeBadge(config.mode);
      if (config.mode === "workshop") {
        await routeWorkshop();
        return;
      }
      setStatus("Checking Streamlit Community Cloud capacity…");
      setHint("AWS workshop capacity is not required in normal mode.");
      startStreamlitRouting();
    }

    boot();
  </script>
</body>
</html>
